<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaStudy — Alemão A1 · Inglês A2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login overlay — shown before app initialises if not authenticated -->
  <div id="loginOverlay" class="login-overlay" style="display:none;">
    <div class="login-card">
      <div class="login-logo">LinguaStudy</div>
      <p class="login-subtitle">Área privada</p>
      <form id="loginForm" class="login-form" autocomplete="off">
        <input
          type="password"
          id="loginInput"
          class="login-input"
          placeholder="Senha"
          autocomplete="current-password"
          autofocus
        >
        <button type="submit" class="btn btn-primary login-btn">Entrar</button>
        <p class="login-error" id="loginError">Senha incorreta. Tente novamente.</p>
      </form>
    </div>
  </div>

  <header class="header">
    <h1>LinguaStudy</h1>
    <nav class="lang-nav" aria-label="Selecionar idioma">
      <button class="lang-btn" data-lang="german">
        Alemão <span class="lang-level">A1</span>
      </button>
      <button class="lang-btn active" data-lang="english">
        Inglês <span class="lang-level">A2</span>
      </button>
    </nav>
  </header>

  <div class="stats-bar" id="statsBar">
    <div class="stat-item">Cards estudados: <strong id="statStudied">0</strong></div>
    <div class="stat-item">Dominados: <strong id="statMastered">0</strong></div>
    <div class="stat-item">Sequência: <strong id="statStreak">0</strong> dia(s)</div>
    <div class="stat-item">Revisões hoje: <strong id="statDueToday">0</strong></div>
  </div>

  <nav class="tabs" id="moduleTabs" aria-label="Módulos de estudo"></nav>

  <div class="container">
    <main id="appRoot">
      <div class="empty-state">
        <h3>Carregando...</h3>
      </div>
    </main>
  </div>

  <script>
    // Detect file:// protocol and show error before module even tries to load
    if (location.protocol === 'file:') {
      document.getElementById('appRoot').innerHTML =
        '<div class="empty-state">' +
        '<h3>Servidor HTTP necessário</h3>' +
        '<p>Abra o terminal na pasta do projeto e execute:</p>' +
        '<pre style="background:#f3f4f6;padding:.75rem 1rem;border-radius:8px;margin:.75rem 0;font-size:.85rem;text-align:left;overflow-x:auto">python english/start.py web</pre>' +
        '<p style="font-size:.85rem;color:#9ca3af">O app usa ES Modules e fetch(), que requerem HTTP.</p>' +
        '</div>';
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
