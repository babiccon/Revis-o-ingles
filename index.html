<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaStudy — Alemão A1 · Inglês A2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>LinguaStudy</h1>
    <nav class="lang-nav" aria-label="Selecionar idioma">
      <button class="lang-btn" data-lang="german">
        Alemão <span class="lang-level">A1</span>
      </button>
      <button class="lang-btn active" data-lang="english">
        Inglês <span class="lang-level">A2</span>
      </button>
    </nav>
  </header>

  <div class="stats-bar" id="statsBar">
    <div class="stat-item">Cards estudados: <strong id="statStudied">0</strong></div>
    <div class="stat-item">Dominados: <strong id="statMastered">0</strong></div>
    <div class="stat-item">Sequência: <strong id="statStreak">0</strong> dia(s)</div>
    <div class="stat-item">Revisões hoje: <strong id="statDueToday">0</strong></div>
  </div>

  <nav class="tabs" id="moduleTabs" aria-label="Módulos de estudo"></nav>

  <div class="container">
    <main id="appRoot">
      <div class="empty-state">
        <h3>Carregando...</h3>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
